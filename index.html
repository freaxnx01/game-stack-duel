document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(this.ac) this.ac.close();\n  }\n\n  clearTimers() { (this.timers || []).forEach(clearTimeout); this.timers = []; }\n\n  buildRots() {\n    const base = {\n      I: { s: 4, c: [[0, 1], [1, 1], [2, 1], [3, 1]] },\n      J: { s: 3, c: [[0, 0], [0, 1], [1, 1], [2, 1]] },\n      L: { s: 3, c: [[2, 0], [0, 1], [1, 1], [2, 1]] },\n      O: { s: 2, c: [[0, 0], [1, 0], [0, 1], [1, 1]] },\n      S: { s: 3, c: [[1, 0], [2, 0], [0, 1], [1, 1]] },\n      T: { s: 3, c: [[1, 0], [0, 1], [1, 1], [2, 1]] },\n      Z: { s: 3, c: [[0, 0], [1, 0], [1, 1], [2, 1]] }\n    };\n    this.ROTS = {}; this.SIZES = {};\n    for (const t in base) {\n      const s = base[t].s;\n      this.SIZES[t] = s;\n      const rots = [base[t].c];\n      for (let r = 1; r < 4; r++) rots.push(rots[r - 1].map(c => [s - 1 - c[1], c[0]]));\n      this.ROTS[t] = rots;\n    }\n  }\n\n  startLevel() { return Math.max(1, Math.min(10, Number(this.props.startLevel ?? 1) || 1)); }\n\n  makePlayer(idx) {\n    return {\n      idx, grid: Array.from({ length: this.ROWS }, () => Array(this.COLS).fill(null)),\n      bag: [], queue: [], cur: null, hold: null, holdUsed: false,\n      score: 0, lines: 0, level: this.startLevel(), gravAcc: 0, soft: false,\n      das: null, lockT: 0, lockResets: 0, clearing: null, pending: 0\n    };\n  }\n\n  fillQueue(p) {\n    while (p.queue.length < 4) {\n      if (!p.bag.length) {\n        p.bag = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];\n        for (let i = p.bag.length - 1; i > 0; i--) {\n          const j = Math.floor(Math.random() * (i + 1));\n          const tmp = p.bag[i]; p.bag[i] = p.bag[j]; p.bag[j] = tmp;\n        }\n      }\n      p.queue.push(p.bag.pop());\n    }\n  }\n\n  collide(p, type, rot, x, y) {\n    const cells = this.ROTS[type][rot];\n    for (let i = 0; i < 4; i++) {\n      const gx = x + cells[i][0], gy = y + cells[i][1];\n      if (gx < 0 || gx >= this.COLS || gy >= this.ROWS) return true;\n      if (gy >= 0 && p.grid[gy][gx]) return true;\n    }\n    return false;\n  }\n for (let y = 1; y < 20; y++) { g.moveTo(0, y * C + 0.5); g.lineTo(W, y * C + 0.5); }\n    g.stroke();\n    const cell = (gx, gy, color, alpha) => {\n      if (gy < this.HID) return;\n      g.globalAlpha = alpha === undefined ? 1 : alpha;\n      g.fillStyle = color;\n      g.fillRect(gx * C + 1.5, (gy - this.HID) * C + 1.5, C - 3, C - 3);\n      g.globalAlpha = 1;\n    };\n    for (let r = this.HID; r < this.ROWS; r++) {\n      for (let c = 0; c < this.COLS; c++) {\n        const v = p.grid[r][c];\n        if (v) cell(c, r, this.COLORS[v]);\n      }\n    }\n    if (p.clearing) {\n      g.globalAlpha = p.clearing.t < 70 ? 0.55 : 0.92;\n      g.fillStyle = '#FFFFFF';\n      for (let i = 0; i < p.clearing.rows.length; i++) {\n        g.fillRect(0, (p.clearing.rows[i] - this.HID) * C, W, C);\n      }\n      g.globalAlpha = 1;\n    }\n    if (p.cur) {\n      const c0 = p.cur, col = this.COLORS[c0.type], cells = this.ROTS[c0.type][c0.rot];\n      if ((this.props.ghostPiece ?? true) && this.state.phase === 'playing') {\n        const gy = this.ghostYOf(p);\n        for (let i = 0; i < 4; i++) cell(c0.x + cells[i][0], gy + cells[i][1], col, 0.16);\n      }\n      for (let i = 0; i < 4; i++) cell(c0.x + cells[i][0], c0.y + cells[i][1], col);\n    }\n  }\n\n  drawMini(g, type, cx, cy, c) {\n    const cells = this.ROTS[type][0];\n    let minx = 9, maxx = -9, miny = 9, maxy = -9;\n    for (let i = 0; i < 4; i++) {\n      minx = Math.min(minx, cells[i][0]); maxx = Math.max(maxx, cells[i][0]);\n      miny = Math.min(miny, cells[i][1]); maxy = Math.max(maxy, cells[i][1]);\n    }\n    const w = (maxx - minx + 1) * c, h = (maxy - miny + 1) * c;\n    g.fillStyle = this.COLORS[type];\n    for (let i = 0; i < 4; i++) {\n      g.fillRect(cx - w / 2 + (cells[i][0] - minx) * c + 0.5, cy - h / 2 + (cells[i][1] - miny) * c + 0.5, c - 1, c - 1);\n    }\n  }\n\n  drawPreviews(p) {\n    const hv = p.idx === 0 ? this.cvH1 : this.cvH2;\n    const nv = p.idx === 0 ? this.cvN1 : this.cvN2;\n    if are', 0.4); T(659, 0.09, 'square', 0.4, 0.07); }\n    else if (name === 'quad') [523, 659, 784, 1046].forEach((f, i) => T(f, 0.09, 'square', 0.45, i * 0.06));\n    else if (name === 'garbage') { T(90, 0.16, 'sawtooth', 0.5); T(60, 0.2, 'sawtooth', 0.4, 0.05); }\n    else if (name === 'warn') { T(200, 0.06, 'square', 0.3); T(160, 0.08, 'square', 0.3, 0.07); }\n    else if (name === 'level') { T(660, 0.07, 'square', 0.35); T(880, 0.1, 'square', 0.35, 0.08); }\n    else if (name === 'tick') T(440, 0.06, 'square', 0.35);\n    else if (name === 'go') T(880, 0.16, 'square', 0.45);\n    else if (name === 'win') [523, 659, 784].forEach((f, i) => T(f, 0.12, 'triangle', 0.5, i * 0.11));\n    else if (name === 'matchwin') [523, 659, 784, 1046, 1318].forEach((f, i) => T(f, 0.14, 'triangle', 0.5, i * 0.12));\n    else if (name === 'lose') [220, 160, 110].forEach((f, i) => T(f, 0.14, 'triangle', 0.45, i * 0.12));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const n1 = String(this.props.p1Name ?? 'Player 1').toUpperCase();\n    const n2 = String(this.props.p2Name ?? 'Player 2').toUpperCase();\n    const names = [n1, n2];\n    const ph = s.phase;\n    const A = this.ACCENTS;\n    const dots = (i) => [0, 1].map(k => ({\n      bg: s.wins[i] > k ? A[i] : 'rgba(0,0,0,0)',\n      bd: s.wins[i] > k ? A[i] : '#CFCFC8'\n    }));\n    let kicker = '', title = '', sub = '', button = '';\n    if (ph === 'menu') {\n      kicker = 'TWO PLAYER · FIRST TO 2 ROUNDS';\n      title = 'STACK DUEL';\n      sub = 'Clear lines to dump garbage rows on your opponent. Top out and you lose the round.';\n      button = 'START MATCH';\n    } else if (ph === 'countdown') {\n      kicker = 'ROUND ' + s.round;\n    } else if (ph === 'roundover') {\n      kicker = 'ROUND ' + s.round;\n      title = names[s.lastWinner] + ' TAKES THE ROUND';\n      sub = n1 + '  ' + s.wins[0] + ' — ' + s.wins[1] + '  ' + n2;\n      button = 'NEXT ROUND';\n    } else if (ph === 'matchover') {\n      kicker = 'MATCH OVER';\n      title = names[s.lastWinner] + ' WINS THE MATCH';\n      sub = n1 + '  ' + s.wins[0] + ' — ' + s.wins[1] + '  ' + n2;\n      button = 'REMATCH';\n    } else if (ph === 'paused') {\n      kicker = 'ROUND ' + s.round;\n      title = 'PAUSED';\n      sub = 'Press P to resume.';\n    }\n    return {\n      p1NameU: n1, p2NameU: n2,\n      p1Score: s.p1.score, p1Lines: s.p1.lines, p1Level: s.p1.level,\n      p2Score: s.p2.score, p2Lines: s.p2.lines, p2Level: s.p2.level,\n      p1IncomingShow: s.p1.incoming > 0, p1Incoming: '+' + s.p1.incoming,\n      p2IncomingShow: s.p2.incoming > 0, p2Incoming: '+' + s.p2.incoming,\n      roundNum: s.round,\n      p1Dots: dots(0), p2Dots: dots(1),\n      overlayVisible: ph !== 'playing',\n      showCountdown: ph === 'countdown',\n      showTitle: ph !== 'countdown',\n      overlayKicker: kicker, overlayTitle: title,\n      overlaySubShow: !!sub, overlaySub: sub,\n      showControls: ph === 'menu',\n      showButton: ph === 'menu' || ph === 'roundover' || ph === 'matchover',\n      buttonLabel: button,\n      countdownText: s.countdown,\n      muteLabel: s.muted ? 'SOUND: OFF' : 'SOUND: ON',\n      toggleMute: this.toggleMute,\n      advance: this.advance,\n      refBoard1: this.refBoard1, refBoard2: this.refBoard2,\n      refHold1: this.refHold1, refHold2: this.refHold2,\n      refNext1: this.refNext1, refNext2: this.refNext2\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
